<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f2">
  <meta name="description" content="冷愁的个人实体藏书馆。以书目、实物照片与入库记录，保存每一本书的来处。">
  <title>冷愁藏书馆 · 个人馆藏</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20261025-shelf-v2">
  <script src="app.js?v=20261028-lotr-set" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至藏书内容</a>
  <header class="site-header">
    <a href="#catalog" class="brand" aria-label="冷愁藏书馆首页"><span class="brand-seal" aria-hidden="true">藏</span><span>冷愁藏书馆</span></a>

  </header>
  <main id="main" tabindex="-1">
    <section id="catalog-page" class="page">
      <section class="catalog-section" aria-label="藏书目录">
        <div class="catalog-heading"><h1>藏书目录</h1><p id="summary"></p></div>
        <div class="search-row"><label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="搜索书名、作者" aria-label="搜索藏书"><kbd aria-hidden="true">/</kbd></label></div>
        <div class="catalog-toolbar"><div id="categories" class="categories" role="group" aria-label="按类别筛选"></div><label class="sort-control"><span>排序</span><select id="sort" aria-label="藏书排序"><option value="series">按分类陈列</option><option value="accession-desc">最近添加</option><option value="title">按书名排序</option></select></label></div>
        <div id="active-filters" class="active-filters" role="group" aria-label="已选筛选条件" hidden></div><p id="results-status" class="results-status" aria-live="polite"></p><div id="collection" aria-busy="true"><p class="loading">正在展开藏书目录…</p></div>
      </section>
    </section>
    <section id="detail-page" class="page" hidden></section>
    <section id="timeline-page" class="page" hidden></section>
    <section id="about-page" class="page" hidden></section>
    <noscript><p>请开启 JavaScript 查看可检索的藏书目录。原始书目可在 data/books.json 中查看。</p></noscript>
  </main>
  <footer class="site-footer"><a href="#catalog">冷愁藏书馆</a><a href="#about">关于</a></footer>
  <dialog id="photo-dialog" aria-labelledby="photo-dialog-title"><div class="lightbox-header"><span id="photo-dialog-title"></span><div><button type="button" id="zoom-out" aria-label="缩小照片">−</button><button type="button" id="zoom-reset">100%</button><button type="button" id="zoom-in" aria-label="放大照片">＋</button><button type="button" id="close-photo" aria-label="关闭照片">✕</button></div></div><div class="lightbox-viewer"><button type="button" class="photo-arrow photo-prev" data-photo-step="-1" aria-label="上一张照片">‹</button><div class="lightbox-body" id="lightbox-body"><img decoding="async" id="lightbox-image" alt=""></div><button type="button" class="photo-arrow photo-next" data-photo-step="1" aria-label="下一张照片">›</button></div><div class="lightbox-footer"><span id="lightbox-position" role="status"></span><p class="lightbox-hint">左右滑动或按方向键切图；双指缩放，放大后拖动查看。按 Esc 关闭。</p></div></dialog>
  <div id="image-errors" class="image-errors" role="status" hidden><span id="image-error-message"></span><button type="button" id="retry-images">重新加载图片</button></div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
