<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f2">
  <meta name="description" content="冷愁的个人实体藏书馆。以书目、实物照片与入库记录，保存每一本书的来处。">
  <title>冷愁藏书馆 · 个人馆藏</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20261024-dune">
  <script src="app.js?v=20261024-dune" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至藏书内容</a>
  <header class="site-header">
    <a href="#catalog" class="brand" aria-label="冷愁藏书馆首页"><span class="brand-seal" aria-hidden="true">藏</span><span>冷愁藏书馆<small>个人实体藏书</small></span></a>
    <nav aria-label="主导航"><a href="#catalog" data-nav="catalog">藏书目录</a><a href="#timeline" data-nav="timeline">入库记录</a><a href="#about" data-nav="about">关于</a></nav>
  </header>
  <main id="main" tabindex="-1">
    <section id="catalog-page" class="page">
      <div class="catalog-intro"><div><p class="eyebrow">私人馆藏</p><h1>纸页有声，<span>藏书有迹。</span></h1><p class="intro-copy">记录拥有的每一本书，也留下它来到书架时的模样。</p></div><div class="accession-note"><span class="status-dot"></span> 编目进行中<small>首批入库 · 2026.10.18</small></div></div>
      <div class="collection-summary" id="summary"></div><section id="recent-books" class="recent-books" aria-label="最近入库"></section>
      <section class="catalog-section" aria-label="藏书目录">
        <div class="catalog-heading"><h2>藏书目录</h2><button class="text-button" id="export-csv" type="button">导出书目 <span aria-hidden="true">↗</span></button></div>
        <div class="search-row"><label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="搜索书名、作者、ISBN 或藏书编号" aria-label="搜索藏书"><kbd aria-hidden="true">/</kbd></label><label class="sort-control"><span>排序</span><select id="sort" aria-label="藏书排序"><option value="accession-asc">入库时间 · 由早到晚</option><option value="accession-desc">入库时间 · 由晚到早</option><option value="title">书名 · 拼音顺序</option><option value="price-asc">折合定价 · 由低到高</option><option value="price-desc">折合定价 · 由高到低</option></select></label></div>
        <button type="button" id="filter-toggle" class="filter-toggle" aria-expanded="false" aria-controls="filter-panel">展开筛选</button><div id="filter-panel" class="filter-panel">        <div class="filter-row"><div id="categories" class="categories" role="group" aria-label="按类别筛选"></div><div class="view-switch" role="group" aria-label="目录显示方式"><button type="button" id="grid-view" aria-label="封面视图" aria-pressed="true"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h5v5H3zM12 3h5v5h-5zM3 12h5v5H3zM12 12h5v5h-5z"/></svg></button><button type="button" id="table-view" aria-label="表格视图" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h14M3 10h14M3 16h14"/></svg></button></div></div>
        <div id="series-shortcuts" class="series-shortcuts" role="group" aria-label="系列快捷导航"></div><div class="series-controls"><label>用途 <select id="usage-filter" aria-label="用途筛选"><option value="all">全部用途</option></select></label><label>语种 <select id="language-filter" aria-label="语种筛选"><option value="all">全部语种</option></select></label><label>系列筛选 <select id="series-filter" aria-label="系列筛选"><option value="all">全部系列与藏书</option></select></label><label>浏览方式 <select id="grouping" aria-label="藏书分组"><option value="series">按系列分组</option><option value="all">全部单册</option></select></label><span>每册独立建档，系列相邻陈列</span></div><div class="filter-actions"><button type="button" id="reset-filters" class="text-button">清除筛选</button><button type="button" id="apply-filters" class="primary-button">查看结果</button></div></div><p id="results-status" class="results-status" aria-live="polite"></p><div id="collection" aria-busy="true"><p class="loading">正在展开藏书目录…</p></div>
      </section>
    </section>
    <section id="detail-page" class="page" hidden></section>
    <section id="timeline-page" class="page" hidden></section>
    <section id="about-page" class="page" hidden></section>
    <noscript><p>请开启 JavaScript 查看可检索的藏书目录。原始书目可在 data/books.json 中查看。</p></noscript>
  </main>
  <footer class="site-footer"><a href="#catalog">冷愁藏书馆</a><span>藏书有序，阅读随心。</span><span>个人实体藏书档案 · <span id="footer-count">首批编目</span></span></footer>
  <dialog id="photo-dialog" aria-labelledby="photo-dialog-title"><div class="lightbox-header"><span id="photo-dialog-title"></span><div><button type="button" id="zoom-out" aria-label="缩小照片">−</button><button type="button" id="zoom-reset">100%</button><button type="button" id="zoom-in" aria-label="放大照片">＋</button><button type="button" id="close-photo" aria-label="关闭照片">✕</button></div></div><div class="lightbox-viewer"><button type="button" class="photo-arrow photo-prev" data-photo-step="-1" aria-label="上一张照片">‹</button><div class="lightbox-body" id="lightbox-body"><img decoding="async" id="lightbox-image" alt=""></div><button type="button" class="photo-arrow photo-next" data-photo-step="1" aria-label="下一张照片">›</button></div><div class="lightbox-footer"><span id="lightbox-position" role="status"></span><p class="lightbox-hint">左右滑动或按方向键切图；双指缩放，放大后拖动查看。按 Esc 关闭。</p></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
