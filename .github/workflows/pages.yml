name: Deploy library to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-images.txt
      - name: Restore verified original photo parts
        run: |
          python scripts/restore_originals.py
          python scripts/test_restore_originals.py
          python scripts/test_prepare_uploads.py
      - name: Reuse photo derivatives
        uses: actions/cache@v4
        with:
          path: .cache/photos
          key: photos-v2-${{ runner.os }}-${{ hashFiles('scripts/optimize_photos.py') }}-${{ hashFiles('dist/assets/**/*-original.jpg') }}
          restore-keys: |
            photos-v2-${{ runner.os }}-${{ hashFiles('scripts/optimize_photos.py') }}-
            photos-v2-${{ runner.os }}-
      - name: Prepare full-frame display images
        run: |
          python -m pip install -r requirements-images.txt
          python scripts/optimize_photos.py
          python scripts/test_photo_asset_preservation.py
          test -s dist/assets/avatar.webp
          test -s dist/assets/cockatiel-corner.webp
      - name: Validate book catalogue
        run: |
          python3 scripts/validate_catalog.py
          python3 scripts/audit_catalog.py
      - name: Reuse JavaScript dependency
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: jsdom-26-1-0-${{ runner.os }}
      - name: Test image recovery and cached catalogue URLs
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund --prefer-offline jsdom@26.1.0
          node scripts/test_image_recovery.cjs
          node scripts/test_shared_photos.cjs
          node scripts/test_purchase_info.cjs
          node scripts/test_catalog_views.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

